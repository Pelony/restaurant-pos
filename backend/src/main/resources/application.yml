spring:
  application:
    name: restaurant-pos

  datasource:
    url: jdbc:postgresql://postgres:5432/posdb
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:mySecretKeyForJWTTokenGenerationThatIsLongEnough12345678901234567890}
  expiration: 86400000

logging:
  level:
    com.pos: DEBUG
    org.springframework.security: DEBUG